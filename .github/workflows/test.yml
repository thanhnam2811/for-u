name: Golden Replay Test

on:
  push:
    branches: [ master ]
    paths:
      - 'src/lines98/js/core/**'
      - 'tests/**'
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  golden-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Golden Replay Test
        run: node tests/golden-test.mjs
