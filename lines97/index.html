<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lines 97 🎱 — Góc Nhỏ Phép Thuật</title>
  <meta name="description" content="Chơi game Lines 97 kinh điển — xếp 5 viên bi cùng màu thành hàng để ghi điểm!">

  <!-- script tối ưu tránh nhấp nháy FOUC khi chọn dark mode -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="../src/lines97/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon.png">
</head>
<body class="bg-gradient-to-br from-[#FFEBF0] to-[#E8F0FE] dark:from-[#0F0C1B] dark:to-[#1B1437] min-h-screen font-sans text-slate-700 dark:text-slate-100 flex justify-center overflow-x-hidden relative transition-colors duration-500 ios-body-pb">
  
  <div class="game-container z-10 flex flex-col items-center select-none">

    <!-- Header -->
    <header class="game-header w-full flex items-center justify-between mb-4 select-none">
      <h1 class="font-display font-bold text-xl sm:text-2xl tracking-wide bg-gradient-to-r from-brand-pink to-brand-purple bg-clip-text text-transparent drop-shadow-sm">Lines 97 🎱</h1>
      <div class="flex gap-2">
        <button class="flex items-center justify-center w-10 h-10 border border-white/60 dark:border-slate-800/60 rounded-xl bg-white/45 dark:bg-slate-900/40 text-slate-500 dark:text-slate-400 hover:text-brand-pink dark:hover:text-brand-purple hover:scale-105 active:scale-95 transition-all shadow-glass-light dark:shadow-glass-dark cursor-pointer pointer-events-auto" id="google-login-btn" aria-label="Đăng nhập">
          <span class="material-icons-round text-xl" id="user-avatar-icon">account_circle</span>
          <img id="user-avatar-img" src="" alt="Avatar" class="w-full h-full rounded-full border border-brand-pink/20 dark:border-brand-purple/20 object-cover" style="display: none;" />
        </button>
        <button class="flex items-center justify-center w-10 h-10 border border-white/60 dark:border-slate-800/60 rounded-xl bg-white/45 dark:bg-slate-900/40 text-slate-500 dark:text-slate-400 hover:text-brand-pink dark:hover:text-brand-purple hover:scale-105 active:scale-95 transition-all shadow-glass-light dark:shadow-glass-dark cursor-pointer pointer-events-auto" id="checkpoint-toggle" aria-label="Checkpoint">
          <span class="material-icons-round text-xl">bookmark</span>
        </button>
        <button class="flex items-center justify-center w-10 h-10 border border-white/60 dark:border-slate-800/60 rounded-xl bg-white/45 dark:bg-slate-900/40 text-slate-500 dark:text-slate-400 hover:text-brand-pink dark:hover:text-brand-purple hover:scale-105 active:scale-95 transition-all shadow-glass-light dark:shadow-glass-dark cursor-pointer pointer-events-auto" id="palette-toggle" aria-label="Bộ màu">
          <span class="material-icons-round text-xl">palette</span>
        </button>
      </div>
    </header>

    <!-- Score / Preview Section -->
    <div class="game-score-container grid grid-cols-3 gap-3 w-full mb-4">
      <div class="bg-white/45 dark:bg-slate-900/40 backdrop-blur-glass border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark rounded-2xl py-3 px-2 flex flex-col items-center justify-center transition-all duration-300">
        <span class="text-[10px] sm:text-xs font-semibold text-brand-muted dark:text-brand-purple/70 uppercase tracking-wider mb-1">Điểm</span>
        <span class="font-display font-bold text-lg sm:text-2xl text-slate-800 dark:text-slate-100" id="score">0</span>
      </div>
      <div class="bg-white/45 dark:bg-slate-900/40 backdrop-blur-glass border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark rounded-2xl py-3 px-2 flex flex-col items-center justify-center transition-all duration-300">
        <span class="text-[10px] sm:text-xs font-semibold text-brand-muted dark:text-brand-purple/70 uppercase tracking-wider mb-1.5">Tiếp theo</span>
        <div class="flex gap-1.5 h-6 items-center justify-center" id="next-preview"></div>
      </div>
      <div class="bg-white/45 dark:bg-slate-900/40 backdrop-blur-glass border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark rounded-2xl py-3 px-2 flex flex-col items-center justify-center transition-all duration-300">
        <span class="text-[10px] sm:text-xs font-semibold text-brand-muted dark:text-brand-purple/70 uppercase tracking-wider mb-1">Kỷ lục</span>
        <span class="font-display font-bold text-lg sm:text-2xl text-slate-800 dark:text-slate-100" id="high-score">0</span>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="game-stats-bar w-full flex items-center justify-around bg-white/30 dark:bg-slate-900/25 backdrop-blur-sm border border-white/30 dark:border-slate-800/30 rounded-xl py-2.5 px-3 mb-4 text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300 select-none shadow-inner">
      <span id="stat-time">⏱ 00:00</span>
      <span id="stat-moves">🎯 0</span>
      <span id="stat-cleared">💥 0</span>
    </div>

    <!-- Game Board -->
    <div class="game-board-container relative w-full aspect-square max-w-[460px] bg-white/45 dark:bg-slate-950/40 backdrop-blur-glass border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark rounded-[24px] sm:rounded-[32px] p-2 sm:p-3 mb-4 transition-all duration-300">
      <div class="w-full h-full grid grid-cols-9 grid-rows-9 gap-[1px] sm:gap-[2px] bg-slate-200/50 dark:bg-slate-800/30 rounded-[16px] sm:rounded-[22px] overflow-hidden" id="game-board"></div>
    </div>

    <!-- Controls -->
    <div class="game-controls-container grid grid-cols-6 sm:grid-cols-5 gap-2 w-full mb-4">
      <button class="col-span-2 sm:col-span-1 flex flex-col items-center justify-center py-2.5 px-1 rounded-2xl bg-white/45 dark:bg-slate-900/40 border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark backdrop-blur-glass text-slate-600 dark:text-slate-300 hover:text-brand-pink dark:hover:text-brand-purple hover:scale-105 active:scale-95 transition-all select-none relative cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100" id="undo-btn" disabled>
        <span class="material-icons-round text-lg sm:text-xl mb-1">undo</span>
        <span class="font-display font-bold text-[10px] sm:text-xs tracking-wide">Hoàn tác</span>
      </button>
      <button class="col-span-2 sm:col-span-1 flex flex-col items-center justify-center py-2.5 px-1 rounded-2xl bg-white/45 dark:bg-slate-900/40 border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark backdrop-blur-glass text-slate-600 dark:text-slate-300 hover:text-brand-pink dark:hover:text-brand-purple hover:scale-105 active:scale-95 transition-all select-none relative cursor-pointer" id="hint-btn">
        <span class="material-icons-round text-lg sm:text-xl mb-1">lightbulb</span>
        <span class="font-display font-bold text-[10px] sm:text-xs tracking-wide">Gợi ý</span>
        <span class="absolute -top-1.5 -right-1.5 bg-gradient-to-br from-brand-pink to-pink-600 text-white text-[9px] font-semibold px-2 py-0.5 rounded-full shadow-[0_2px_6px_rgba(255,117,151,0.4)]" id="hint-count">3</span>
      </button>
      <button class="col-span-2 sm:col-span-1 flex flex-col items-center justify-center py-2.5 px-1 rounded-2xl bg-white/45 dark:bg-slate-900/40 border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark backdrop-blur-glass text-slate-600 dark:text-slate-300 hover:text-brand-pink dark:hover:text-brand-purple hover:scale-105 active:scale-95 transition-all select-none relative cursor-pointer" id="new-game-btn">
        <span class="material-icons-round text-lg sm:text-xl mb-1">refresh</span>
        <span class="font-display font-bold text-[10px] sm:text-xs tracking-wide">Mới</span>
      </button>
      <button class="col-span-3 sm:col-span-1 flex flex-col items-center justify-center py-2.5 px-1 rounded-2xl bg-white/45 dark:bg-slate-900/40 border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark backdrop-blur-glass text-slate-600 dark:text-slate-300 hover:text-brand-pink dark:hover:text-brand-purple hover:scale-105 active:scale-95 transition-all select-none relative cursor-pointer" id="sound-toggle">
        <span class="material-icons-round text-lg sm:text-xl mb-1" id="sound-icon">volume_up</span>
        <span class="font-display font-bold text-[10px] sm:text-xs tracking-wide" id="sound-label">Âm</span>
      </button>
      <button class="col-span-3 sm:col-span-1 flex flex-col items-center justify-center py-2.5 px-1 rounded-2xl bg-white/45 dark:bg-slate-900/40 border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark backdrop-blur-glass text-slate-600 dark:text-slate-300 hover:text-brand-pink dark:hover:text-brand-purple hover:scale-105 active:scale-95 transition-all select-none relative cursor-pointer" id="leaderboard-btn">
        <span class="material-icons-round text-lg sm:text-xl mb-1">emoji_events</span>
        <span class="font-display font-bold text-[10px] sm:text-xs tracking-wide">Top</span>
      </button>
    </div>

    <!-- Instructions -->
    <div class="game-instructions-container w-full text-center bg-white/20 dark:bg-slate-900/10 backdrop-blur-sm border border-white/30 dark:border-slate-800/30 rounded-xl py-2 px-3 text-[11px] sm:text-xs font-semibold text-slate-500 dark:text-slate-400 select-none shadow-sm">
      <p>🎯 Click bi → Click ô trống → Xếp 5+ bi cùng màu!</p>
    </div>

    <!-- Game Over Overlay -->
    <div class="game-over-overlay fixed inset-0 bg-slate-900/45 dark:bg-slate-950/60 backdrop-blur-sm z-[99] flex items-center justify-center pointer-events-none opacity-0 invisible transition-all duration-300" id="game-over-overlay">
      <div class="w-[90%] max-w-[420px] bg-white/75 dark:bg-slate-900/50 backdrop-blur-md border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark rounded-[28px] sm:rounded-[36px] p-6 sm:p-8 flex flex-col items-center transform scale-95 transition-all duration-300 relative pointer-events-auto">
        <span class="text-4xl mb-4">😢</span>
        <h2 class="font-display font-bold text-xl sm:text-2xl text-slate-800 dark:text-slate-100 mb-3 select-none">Hết chỗ rồi!</h2>
        <p class="font-sans font-semibold text-slate-600 dark:text-slate-300 text-sm mb-1">Điểm: <span id="final-score">0</span></p>
        <p class="font-sans font-semibold text-slate-400 dark:text-slate-500 text-xs mb-6">Kỷ lục: <span id="final-high">0</span></p>
        <div class="flex flex-col gap-3 w-full">
          <button class="w-full font-display font-bold text-sm sm:text-base text-white bg-gradient-to-r from-brand-pink to-brand-purple rounded-2xl py-3 shadow-brand hover:shadow-brand-hover hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 cursor-pointer" id="restart-btn">
            <span class="material-icons-round align-middle text-lg mr-1">replay</span> Chơi lại
          </button>
          <button class="w-full font-sans font-bold text-sm sm:text-base text-slate-700 dark:text-slate-200 bg-white/30 dark:bg-slate-800/30 border border-white/40 dark:border-slate-700/40 rounded-2xl py-3 hover:bg-white/50 dark:hover:bg-slate-800/50 transition-all cursor-pointer" id="load-checkpoint-btn" style="display:none">
            <span class="material-icons-round align-middle text-lg mr-1">bookmark</span> Tải checkpoint
          </button>
        </div>
      </div>
    </div>

    <!-- Leaderboard Overlay -->
    <div class="game-over-overlay fixed inset-0 bg-slate-900/45 dark:bg-slate-950/60 backdrop-blur-sm z-[99] flex items-center justify-center pointer-events-none opacity-0 invisible transition-all duration-300" id="leaderboard-overlay">
      <div class="w-[95%] max-w-[460px] bg-white/75 dark:bg-slate-900/50 backdrop-blur-md border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark rounded-[28px] sm:rounded-[36px] p-5 sm:p-8 flex flex-col items-center transform scale-95 transition-all duration-300 relative pointer-events-auto">
        <h2 class="font-display font-bold text-xl sm:text-2xl text-slate-800 dark:text-slate-100 mb-4 select-none">🏆 Top 10</h2>
        <div class="w-full mb-6 max-h-[300px] overflow-y-auto space-y-2.5 pr-1" id="leaderboard-list"></div>
        <button class="w-full font-display font-bold text-sm sm:text-base text-white bg-gradient-to-r from-brand-pink to-brand-purple rounded-2xl py-3 shadow-brand hover:shadow-brand-hover hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 cursor-pointer" id="close-leaderboard-btn">
          <span class="material-icons-round align-middle text-lg mr-1">close</span> Đóng
        </button>
      </div>
    </div>

    <!-- Palette Modal -->
    <div class="game-over-overlay fixed inset-0 bg-slate-900/45 dark:bg-slate-950/60 backdrop-blur-sm z-[99] flex items-center justify-center pointer-events-none opacity-0 invisible transition-all duration-300" id="palette-modal">
      <div class="w-[90%] max-w-[420px] bg-white/75 dark:bg-slate-900/50 backdrop-blur-md border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark rounded-[28px] sm:rounded-[36px] p-6 sm:p-8 flex flex-col transform scale-95 transition-all duration-300 relative pointer-events-auto">
        <div class="w-full flex items-center justify-between border-b border-slate-200/50 dark:border-slate-800/50 pb-3 mb-5 select-none">
          <h2 class="font-display font-bold text-lg sm:text-xl text-slate-800 dark:text-slate-100">🎨 Chọn bộ màu</h2>
          <button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors cursor-pointer" id="close-palette-btn" aria-label="Đóng">
            <span class="material-icons-round">close</span>
          </button>
        </div>
        <div class="max-h-[300px] overflow-y-auto space-y-3.5" id="palette-options-container"></div>
      </div>
    </div>

    <!-- Checkpoint Modal -->
    <div class="game-over-overlay fixed inset-0 bg-slate-900/45 dark:bg-slate-950/60 backdrop-blur-sm z-[99] flex items-center justify-center pointer-events-none opacity-0 invisible transition-all duration-300" id="checkpoint-modal">
      <div class="w-[90%] max-w-[420px] bg-white/75 dark:bg-slate-900/50 backdrop-blur-md border border-white/60 dark:border-slate-800/60 shadow-glass-light dark:shadow-glass-dark rounded-[28px] sm:rounded-[36px] p-6 sm:p-8 flex flex-col transform scale-95 transition-all duration-300 relative pointer-events-auto">
        <div class="w-full flex items-center justify-between border-b border-slate-200/50 dark:border-slate-800/50 pb-3 mb-5 select-none">
          <h2 class="font-display font-bold text-lg sm:text-xl text-slate-800 dark:text-slate-100">📌 Checkpoint</h2>
          <button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors cursor-pointer" id="close-checkpoint-btn" aria-label="Đóng">
            <span class="material-icons-round">close</span>
          </button>
        </div>
        <div class="space-y-4">
          <div class="bg-white/40 dark:bg-slate-900/20 border border-slate-200/40 dark:border-slate-800/40 rounded-2xl p-4 flex items-center justify-between" data-slot="0">
            <div class="flex flex-col"><span class="font-display font-bold text-sm text-slate-800 dark:text-slate-200">Slot 1</span><span class="text-[11px] text-slate-400 dark:text-slate-500 font-semibold" data-slot="0">Trống</span></div>
            <div class="flex gap-2">
              <button class="cp-save font-sans font-bold text-xs text-white bg-brand-pink hover:bg-brand-pink/90 px-3.5 py-2 rounded-xl shadow-sm transition-all cursor-pointer"><span class="material-icons-round text-sm align-middle mr-0.5">save</span> Lưu</button>
              <button class="cp-load font-sans font-bold text-xs text-slate-700 dark:text-slate-200 bg-white/30 dark:bg-slate-800/30 border border-white/40 dark:border-slate-700/40 px-3.5 py-2 rounded-xl transition-all cursor-pointer" disabled><span class="material-icons-round text-sm align-middle mr-0.5">play_arrow</span> Tải</button>
            </div>
          </div>
          <div class="bg-white/40 dark:bg-slate-900/20 border border-slate-200/40 dark:border-slate-800/40 rounded-2xl p-4 flex items-center justify-between" data-slot="1">
            <div class="flex flex-col"><span class="font-display font-bold text-sm text-slate-800 dark:text-slate-200">Slot 2</span><span class="text-[11px] text-slate-400 dark:text-slate-500 font-semibold" data-slot="1">Trống</span></div>
            <div class="flex gap-2">
              <button class="cp-save font-sans font-bold text-xs text-white bg-brand-pink hover:bg-brand-pink/90 px-3.5 py-2 rounded-xl shadow-sm transition-all cursor-pointer"><span class="material-icons-round text-sm align-middle mr-0.5">save</span> Lưu</button>
              <button class="cp-load font-sans font-bold text-xs text-slate-700 dark:text-slate-200 bg-white/30 dark:bg-slate-800/30 border border-white/40 dark:border-slate-700/40 px-3.5 py-2 rounded-xl transition-all cursor-pointer" disabled><span class="material-icons-round text-sm align-middle mr-0.5">play_arrow</span> Tải</button>
            </div>
          </div>
          <div class="bg-white/40 dark:bg-slate-900/20 border border-slate-200/40 dark:border-slate-800/40 rounded-2xl p-4 flex items-center justify-between" data-slot="2">
            <div class="flex flex-col"><span class="font-display font-bold text-sm text-slate-800 dark:text-slate-200">Slot 3</span><span class="text-[11px] text-slate-400 dark:text-slate-500 font-semibold" data-slot="2">Trống</span></div>
            <div class="flex gap-2">
              <button class="cp-save font-sans font-bold text-xs text-white bg-brand-pink hover:bg-brand-pink/90 px-3.5 py-2 rounded-xl shadow-sm transition-all cursor-pointer"><span class="material-icons-round text-sm align-middle mr-0.5">save</span> Lưu</button>
              <button class="cp-load font-sans font-bold text-xs text-slate-700 dark:text-slate-200 bg-white/30 dark:bg-slate-800/30 border border-white/40 dark:border-slate-700/40 px-3.5 py-2 rounded-xl transition-all cursor-pointer" disabled><span class="material-icons-round text-sm align-middle mr-0.5">play_arrow</span> Tải</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script type="module" src="../src/lines97/js/main.js"></script>
</body>
</html>
